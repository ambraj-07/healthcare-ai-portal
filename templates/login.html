<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - HealthCore AI</title>
    <style>
        :root { --primary: #2563eb; --background: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --radius: 10px; }
        body { font-family: sans-serif; background-color: var(--background); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: var(--surface); padding: 40px; border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 400px; border: 1px solid var(--border); }
        h2 { margin-top: 0; color: #0f172a; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .switch-link { text-align: center; margin-top: 15px; font-size: 14px; color: #64748b; }
        .switch-link a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .error { background: #fef2f2; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Sign In to HealthCore</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="switch-link">Don't have an account? <a href="/register">Register here</a></div>
    </div>
</body>
</html>
